<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<title>Inventario de computadores - Inventario APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
<style>
  .barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;max-width:1200px;margin:0 auto;padding-block:14px}
  .barra .marca{margin:0;font-size:18px;font-weight:700;letter-spacing:.01em;flex:1 1 auto}
  .barra .marca span{color:var(--muted);font-weight:600}
  .barra .quien{font-size:14px;color:var(--muted)}
  main{max-width:1200px;margin:0 auto;padding-bottom:32px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  main > *{min-width:0}
  h2{margin:0 0 12px;font-size:17px}
  fieldset{margin:0 0 14px;padding:12px 14px 14px;border:1px solid var(--line);border-radius:6px;min-width:0}
  legend{padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .grid .ancho{grid-column:1/-1}
  textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid #b9b9b9;border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:16px;resize:vertical}
  :is(textarea):focus-visible{outline:3px solid var(--signal);outline-offset:2px}
  .acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .cabecera{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin-bottom:12px}
  .cabecera h2{margin:0}
  .filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
  .filtros .field{margin:0}
  .exporta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
  .exporta .botones{display:flex;flex-wrap:wrap;gap:8px}
  .menu-exp{position:relative}
  .menu-exp summary{list-style:none;display:inline-flex;align-items:center;cursor:pointer}
  .menu-exp summary::-webkit-details-marker{display:none}
  .menu-exp .menu-lista{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:190px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.18);padding:4px}
  .menu-exp .menu-lista button{background:none;border:0;color:var(--ink);text-align:left;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;border-radius:4px}
  .menu-exp .menu-lista button:hover,.menu-exp .menu-lista button:focus-visible{background:var(--ground)}
  .buscar{width:min(100%,340px)}
  .tabla{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px}
  .tabla th{position:sticky;top:0;background:var(--card);z-index:1}
  table{width:100%;min-width:960px;border-collapse:collapse;font-size:14px}
  th{padding:8px;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #e6e6e6;vertical-align:top}
  .vacio{padding:18px 8px;color:var(--muted)}
  .denegado{max-width:520px;margin:48px auto}
  .denegado p{margin:0 0 14px}
  .req{color:var(--danger)}
  #archivo{width:min(100%,360px);height:auto;padding:8px 10px}
  .errores{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--err-ink)}
  .nota{margin:0 0 12px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

  <header class="barra" id="barra" hidden>
    <h1 class="marca">Inventario APP <span>· Computadores</span></h1>
    <span class="quien" id="quien"></span>
    <a class="link" href="index.html">Inicio</a>
    <a class="link" href="usuarios.html">Usuarios</a>
    <button class="sec mini" type="button" id="salir">Salir</button>
  </header>

  <main id="contenido" hidden>
    <section class="card">
      <div class="cabecera">
        <h2>Computadores registrados <span id="total" class="nota"></span></h2>
        <div class="field buscar">
          <label for="buscar">Buscar</label>
          <input id="buscar" type="search" autocomplete="off" placeholder="CC, nombre, apellido, placa…">
        </div>
      </div>
      <div class="filtros" id="filtros"></div>
      <div class="exporta">
        <strong id="conteo" role="status" aria-live="polite"></strong>
        <span class="botones">
          <details class="menu-exp" id="menu-exp">
            <summary class="sec mini btn-summary">Exportar ▾</summary>
            <div class="menu-lista">
              <button type="button" id="exp-xlsx">Excel (.xlsx)</button>
              <button type="button" id="exp-csv">CSV (.csv)</button>
              <button type="button" id="exp-txt">Texto plano (.txt)</button>
            </div>
          </details>
        </span>
      </div>
      <p class="status" id="estado" role="status" aria-live="polite"></p>
      <div class="tabla">
        <table>
          <thead><tr><th>CC</th><th>Nombres</th><th>Apellidos</th><th>Sede</th><th>Dependencia</th><th>Placa</th><th>Estado</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <section class="card denegado" id="denegado" hidden>
    <h1 class="eyebrow">Acceso restringido</h1>
    <p id="denegado-texto">Esta página es solo para los roles Administrador y Soporte.</p>
    <a class="link" href="index.html">Ir a iniciar sesión</a>
  </section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var COL = 'computadores';
  var yo = null, editando = null, equipos = [];

  var ESTADOS = ['Activo', 'Baja', 'Garantía'];
  // Grupos de preguntas del formulario: [clave, etiqueta, obligatorio, tipo, opciones]
  var GRUPOS = [
    ['Responsable', [
      ['cc', 'CC', true], ['nombres', 'Nombres', true], ['apellidos', 'Apellidos', true],
      ['sede', 'Sede'], ['dependencia', 'Dependencia'],
      ['tipoContrato', 'Tipo contrato'], ['numeroContrato', 'Número contrato']
    ]],
    ['Clasificación', [['estado', 'Estado', true, 'select', ESTADOS]]],
    ['Equipo', [['placa', 'Placa']]]
  ];
  var CAMPOS = [];
  GRUPOS.forEach(function (g) { g[1].forEach(function (c) { CAMPOS.push(c); }); });

  function msg(t, tipo) { $('estado').textContent = t || ''; $('estado').className = 'status' + (tipo ? ' ' + tipo : ''); }
  function el(tag, props, hijos) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === 'text') e.textContent = props[k]; else if (k === 'cls') e.className = props[k]; else e[k] = props[k]; });
    (hijos || []).forEach(function (h) { e.appendChild(h); });
    return e;
  }
  function limpio(v) { return String(v == null ? '' : v).trim(); }
  function norm(v) { return limpio(v).toLowerCase(); }

  /* ---------- tabla ---------- */
  async function cargar() {
    try {
      var snap = await firebase.firestore().collection(COL).get();
      equipos = [];
      snap.forEach(function (d) { var x = d.data(); x.id = d.id; equipos.push(x); });
      equipos.sort(function (a, b) { return norm(a.apellidos + ' ' + a.nombres) < norm(b.apellidos + ' ' + b.nombres) ? -1 : 1; });
      pintar();
    } catch (err) {
      msg(err && err.code === 'permission-denied' ? 'No tiene permiso para ver los computadores.' : ((err && err.message) || 'No se pudo cargar la lista.'), 'err');
    }
  }
  var FILTROS = [['cc', 'CC'], ['nombres', 'Nombres'], ['apellidos', 'Apellidos']];
  var filtroVal = {};
  var visibles = [];
  function hayFiltro0(q) { return !!q || FILTROS.some(function (f) { return norm(filtroVal[f[0]]); }); }
  var filtrosListos = false;
  function armarFiltros() {
    var cont = $('filtros');
    if (!filtrosListos) {
      filtrosListos = true;
      FILTROS.forEach(function (f) {
        var k = f[0];
        var inp = el('input', { id: 'f-' + k, type: 'search', autocomplete: 'off', placeholder: 'Escriba ' + f[1] + '…' });
        inp.setAttribute('list', 'dl-' + k);
        inp.addEventListener('input', function () { filtroVal[k] = inp.value; pintar(); });
        cont.appendChild(el('div', { cls: 'field' }, [el('label', { htmlFor: 'f-' + k, text: f[1] }), inp, el('datalist', { id: 'dl-' + k })]));
      });
    }
    // Sugerencias: valores existentes que coinciden con lo escrito en ese filtro
    FILTROS.forEach(function (f) {
      var k = f[0], q = norm(filtroVal[k]), vistos = {};
      equipos.forEach(function (e) { var v = limpio(e[k]); if (v && (!q || norm(v).indexOf(q) >= 0)) vistos[v] = 1; });
      var dl = $('dl-' + k); dl.textContent = '';
      Object.keys(vistos).sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; }).slice(0, 50)
        .forEach(function (v) { dl.appendChild(el('option', { value: v })); });
    });
  }
  function pintar() {
    var q = norm($('buscar').value), tb = $('tbody'); tb.textContent = '';
    armarFiltros();
    var lista = equipos.filter(function (eq) {
      for (var i = 0; i < FILTROS.length; i++) {
        var v = filtroVal[FILTROS[i][0]];
        if (norm(v) && norm(eq[FILTROS[i][0]]).indexOf(norm(v)) < 0) return false;
      }
      if (!q) return true;
      return CAMPOS.some(function (c) { return norm(eq[c[0]]).indexOf(q) >= 0; });
    });
    visibles = lista;
    $('conteo').textContent = String(lista.length) + (hayFiltro0(q) ? ' de ' + equipos.length : '');
    var hayFiltro = q || FILTROS.some(function (f) { return filtroVal[f[0]]; });
    $('total').textContent = '(' + lista.length + (hayFiltro ? ' de ' + equipos.length : '') + ')';
    if (!lista.length) {
      tb.appendChild(el('tr', {}, [el('td', { colSpan: 7, cls: 'vacio', text: equipos.length ? 'Ningún computador coincide con la búsqueda.' : 'Aún no hay computadores registrados.' })]));
      return;
    }
    lista.forEach(function (eq) {
      tb.appendChild(el('tr', {}, [
        el('td', { text: eq.cc || '' }),
        el('td', { text: eq.nombres || '' }),
        el('td', { text: eq.apellidos || '' }),
        el('td', { text: eq.sede || '' }),
        el('td', { text: eq.dependencia || '' }),
        el('td', { text: eq.placa || '' }),
        el('td', { text: eq.estado || '' })
      ]));
    });
  }
  $('buscar').addEventListener('input', pintar);

  /* ---------- exportar lo que se está viendo ---------- */
  function filasExport() {
    var enc = CAMPOS.map(function (c) { return c[1]; });
    return [enc].concat(visibles.map(function (e) { return CAMPOS.map(function (c) { return limpio(e[c[0]]); }); }));
  }
  function descargar(contenido, nombre, tipo) {
    var url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
    var a = document.createElement('a'); a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function nombreArchivo(ext) { return 'computadores_' + new Date().toISOString().slice(0, 10) + '.' + ext; }
  function sinDatos() { if (!visibles.length) { msg('No hay resultados para exportar.', 'err'); return true; } msg(''); return false; }
  $('exp-csv').addEventListener('click', function () {
    if (sinDatos()) return;
    var csv = filasExport().map(function (f) { return f.map(function (v) { return '"' + v.replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
    descargar('\ufeff' + csv, nombreArchivo('csv'), 'text/csv;charset=utf-8');
  });
  $('exp-txt').addEventListener('click', function () {
    if (sinDatos()) return;
    var txt = filasExport().map(function (f) { return f.map(function (v) { return v.replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\r\n');
    descargar(txt, nombreArchivo('txt'), 'text/plain;charset=utf-8');
  });
  $('exp-xlsx').addEventListener('click', function () {
    if (sinDatos()) return;
    if (!window.XLSX) { msg('No se pudo cargar el generador de Excel. Use CSV o revise su conexión.', 'err'); return; }
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasExport()), 'Computadores');
    XLSX.writeFile(wb, nombreArchivo('xlsx'));
  });

  $('salir').addEventListener('click', function () { App.logout().then(function () { location.href = 'index.html'; }); });

  /* ---------- arranque ---------- */
  App.init().then(function () {
    yo = App.current();
    if (!yo) {
      $('denegado-texto').textContent = 'Inicie sesión para entrar a esta página.';
      $('denegado').hidden = false; return;
    }
    if (yo.rol !== 'Administrador' && yo.rol !== 'Soporte') { $('denegado').hidden = false; return; }
    $('quien').textContent = yo.nombre + ' (' + yo.rol + ')';
    $('barra').hidden = false; $('contenido').hidden = false;
    cargar();
  });
})();
</script>
<script>
(function () {
  var m = document.getElementById('menu-exp'); if (!m) return;
  m.addEventListener('click', function (e) { if (e.target.closest('.menu-lista button')) m.open = false; });
  document.addEventListener('click', function (e) { if (m.open && !m.contains(e.target)) m.open = false; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') m.open = false; });
})();
</script>
</body>
</html>
