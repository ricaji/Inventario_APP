<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<title>Inventario de computadores - Inventario APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
<style>
  .barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;max-width:1200px;margin:0 auto;padding-block:14px}
  .barra .marca{margin:0;font-size:18px;font-weight:700;letter-spacing:.01em;flex:1 1 auto}
  .barra .marca span{color:var(--muted);font-weight:600}
  .barra .quien{font-size:14px;color:var(--muted)}
  main{max-width:1200px;margin:0 auto;padding-bottom:32px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  main > *{min-width:0}
  h2{margin:0 0 12px;font-size:17px}
  fieldset{margin:0 0 14px;padding:12px 14px 14px;border:1px solid var(--line);border-radius:6px;min-width:0}
  legend{padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .grid .ancho{grid-column:1/-1}
  textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid #b9b9b9;border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:16px;resize:vertical}
  :is(textarea):focus-visible{outline:3px solid var(--signal);outline-offset:2px}
  .acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .cabecera{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin-bottom:12px}
  .cabecera h2{margin:0}
  .buscar{width:min(100%,340px)}
  .tabla{overflow-x:auto}
  table{width:100%;min-width:900px;border-collapse:collapse;font-size:14px}
  th{padding:8px;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #e6e6e6;vertical-align:top}
  .vacio{padding:18px 8px;color:var(--muted)}
  .denegado{max-width:520px;margin:48px auto}
  .denegado p{margin:0 0 14px}
  .req{color:var(--danger)}
  .nota{margin:0 0 12px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

  <header class="barra" id="barra" hidden>
    <h1 class="marca">Inventario APP <span>· Computadores</span></h1>
    <span class="quien" id="quien"></span>
    <a class="link" href="usuarios.html">Usuarios</a>
    <button class="sec mini" type="button" id="salir">Salir</button>
  </header>

  <main id="contenido" hidden>
    <section class="card">
      <h2 id="form-titulo">Registrar computador</h2>
      <p class="nota">Los campos con <span class="req">*</span> son obligatorios.</p>
      <form id="f-equipo" novalidate>
        <div id="campos"></div>
        <div class="acciones">
          <button class="go" type="submit" id="guardar">Guardar computador</button>
          <button class="sec" type="button" id="cancelar" hidden>Cancelar edición</button>
        </div>
      </form>
      <p class="status" id="estado" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="cabecera">
        <h2>Computadores registrados <span id="total" class="nota"></span></h2>
        <div class="field buscar">
          <label for="buscar">Buscar</label>
          <input id="buscar" type="search" autocomplete="off" placeholder="CC, nombre, hostname, placa, serial…">
        </div>
      </div>
      <div class="tabla">
        <table>
          <thead><tr><th>CC</th><th>Responsable</th><th>Sede</th><th>Dependencia</th><th>Hostname</th><th>Marca / Modelo</th><th>Placa</th><th>Serial</th><th>Acciones</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <section class="card denegado" id="denegado" hidden>
    <h1 class="eyebrow">Acceso restringido</h1>
    <p id="denegado-texto">Esta página es solo para los roles Administrador y Soporte.</p>
    <a class="link" href="index.html">Ir a iniciar sesión</a>
  </section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var COL = 'computadores';
  var yo = null, editando = null, equipos = [];

  // Grupos de preguntas del formulario: [clave, etiqueta, obligatorio, tipo]
  var GRUPOS = [
    ['Responsable', [
      ['cc', 'CC', true], ['nombres', 'Nombres', true], ['apellidos', 'Apellidos', true],
      ['sede', 'Sede'], ['dependencia', 'Dependencia'],
      ['tipoContrato', 'Tipo contrato'], ['numeroContrato', 'Número contrato']
    ]],
    ['Clasificación', [['tipo1', 'Tipo 1'], ['tipo2', 'Tipo 2']]],
    ['Equipo', [
      ['hostname', 'Hostname', true], ['marca', 'Marca'], ['modelo', 'Modelo'], ['placa', 'Placa'], ['serial', 'Serial']
    ]],
    ['Hardware', [
      ['procesador', 'Procesador'], ['generacion', 'Generación'], ['ram', 'RAM'], ['ramTipo', 'Tipo (RAM)'],
      ['dd1Cantidad', 'DD cantidad 1'], ['dd1Tipo', 'DD tipo 1'], ['dd2Cantidad', 'DD cantidad 2'], ['dd2Tipo', 'DD tipo 2']
    ]],
    ['Software', [
      ['windows', 'Windows'], ['clave', 'Clave'], ['office', 'Office'], ['activacion', 'Activación'], ['antivirus', 'Antivirus']
    ]],
    ['Observaciones', [['observaciones', 'Observaciones', false, 'area']]]
  ];
  var CAMPOS = [];
  GRUPOS.forEach(function (g) { g[1].forEach(function (c) { CAMPOS.push(c); }); });

  function msg(t, tipo) { $('estado').textContent = t || ''; $('estado').className = 'status' + (tipo ? ' ' + tipo : ''); }
  function el(tag, props, hijos) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === 'text') e.textContent = props[k]; else if (k === 'cls') e.className = props[k]; else e[k] = props[k]; });
    (hijos || []).forEach(function (h) { e.appendChild(h); });
    return e;
  }
  function limpio(v) { return String(v == null ? '' : v).trim(); }
  function norm(v) { return limpio(v).toLowerCase(); }

  /* ---------- formulario ---------- */
  function construirFormulario() {
    var cont = $('campos');
    GRUPOS.forEach(function (g) {
      var grid = el('div', { cls: 'grid' });
      g[1].forEach(function (c) {
        var area = c[3] === 'area';
        var id = 'c-' + c[0];
        var lbl = el('label', { htmlFor: id });
        lbl.appendChild(document.createTextNode(c[1] + ' '));
        if (c[2]) lbl.appendChild(el('span', { cls: 'req', text: '*' }));
        var inp = area ? el('textarea', { id: id, maxLength: 1000 })
                       : el('input', { id: id, maxLength: 120, autocomplete: 'off' });
        if (!area) inp.setAttribute('autocapitalize', 'none');
        grid.appendChild(el('div', { cls: 'field' + (area ? ' ancho' : '') }, [lbl, inp]));
      });
      cont.appendChild(el('fieldset', {}, [el('legend', { text: g[0] }), grid]));
    });
  }
  function valores() {
    var d = {};
    CAMPOS.forEach(function (c) { d[c[0]] = limpio($('c-' + c[0]).value); });
    return d;
  }
  function ponerValores(d) {
    CAMPOS.forEach(function (c) { $('c-' + c[0]).value = d[c[0]] || ''; });
  }
  function salirEdicion() {
    editando = null;
    ponerValores({});
    $('form-titulo').textContent = 'Registrar computador';
    $('guardar').textContent = 'Guardar computador';
    $('cancelar').hidden = true;
  }
  function editar(eq) {
    editando = eq.id;
    ponerValores(eq);
    $('form-titulo').textContent = 'Editar computador: ' + (eq.hostname || eq.cc);
    $('guardar').textContent = 'Guardar cambios';
    $('cancelar').hidden = false;
    msg('');
    $('c-cc').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('cancelar').addEventListener('click', function () { salirEdicion(); msg(''); });

  function validar(d) {
    for (var i = 0; i < CAMPOS.length; i++) {
      if (CAMPOS[i][2] && !d[CAMPOS[i][0]]) return 'Complete el campo ' + CAMPOS[i][1] + '.';
    }
    var dup = function (campo, etiqueta) {
      if (!d[campo]) return null;
      var otro = equipos.filter(function (e) { return e.id !== editando && norm(e[campo]) === norm(d[campo]); })[0];
      return otro ? 'Ya existe un computador con ' + etiqueta + ' ' + d[campo] + '.' : null;
    };
    return dup('hostname', 'el hostname') || dup('serial', 'el serial') || dup('placa', 'la placa');
  }

  $('f-equipo').addEventListener('submit', async function (e) {
    e.preventDefault();
    var d = valores(), error = validar(d);
    if (error) { msg(error, 'err'); return; }
    $('guardar').disabled = true;
    try {
      var col = firebase.firestore().collection(COL);
      d.actualizadoPor = yo.usuario;
      d.actualizado = firebase.firestore.FieldValue.serverTimestamp();
      if (editando) { await col.doc(editando).update(d); msg('Computador actualizado.', 'ok'); }
      else { d.creadoPor = yo.usuario; await col.add(d); msg('Computador registrado.', 'ok'); }
      salirEdicion();
      await cargar();
    } catch (err) {
      msg(err && err.code === 'permission-denied' ? 'No tiene permiso para realizar esta acción.' : ((err && err.message) || 'No se pudo guardar.'), 'err');
    }
    $('guardar').disabled = false;
  });

  /* ---------- tabla ---------- */
  async function cargar() {
    try {
      var snap = await firebase.firestore().collection(COL).get();
      equipos = [];
      snap.forEach(function (d) { var x = d.data(); x.id = d.id; equipos.push(x); });
      equipos.sort(function (a, b) { return norm(a.hostname) < norm(b.hostname) ? -1 : 1; });
      pintar();
    } catch (err) {
      msg(err && err.code === 'permission-denied' ? 'No tiene permiso para ver los computadores.' : ((err && err.message) || 'No se pudo cargar la lista.'), 'err');
    }
  }
  function pintar() {
    var q = norm($('buscar').value), tb = $('tbody'); tb.textContent = '';
    var lista = equipos.filter(function (eq) {
      if (!q) return true;
      return CAMPOS.some(function (c) { return norm(eq[c[0]]).indexOf(q) >= 0; });
    });
    $('total').textContent = '(' + lista.length + (q ? ' de ' + equipos.length : '') + ')';
    if (!lista.length) {
      tb.appendChild(el('tr', {}, [el('td', { colSpan: 9, cls: 'vacio', text: equipos.length ? 'Ningún computador coincide con la búsqueda.' : 'Aún no hay computadores registrados.' })]));
      return;
    }
    lista.forEach(function (eq) {
      var bEd = el('button', { cls: 'sec mini', type: 'button', text: 'Editar' });
      bEd.addEventListener('click', function () { editar(eq); });
      tb.appendChild(el('tr', {}, [
        el('td', { text: eq.cc || '' }),
        el('td', { text: ((eq.nombres || '') + ' ' + (eq.apellidos || '')).trim() }),
        el('td', { text: eq.sede || '' }),
        el('td', { text: eq.dependencia || '' }),
        el('td', { text: eq.hostname || '' }),
        el('td', { text: ((eq.marca || '') + ' ' + (eq.modelo || '')).trim() }),
        el('td', { text: eq.placa || '' }),
        el('td', { text: eq.serial || '' }),
        el('td', {}, [bEd])
      ]));
    });
  }
  $('buscar').addEventListener('input', pintar);

  $('salir').addEventListener('click', function () { App.logout().then(function () { location.href = 'index.html'; }); });

  /* ---------- arranque ---------- */
  App.init().then(function () {
    yo = App.current();
    if (!yo) {
      $('denegado-texto').textContent = 'Inicie sesión para entrar a esta página.';
      $('denegado').hidden = false; return;
    }
    if (yo.rol !== 'Administrador' && yo.rol !== 'Soporte') { $('denegado').hidden = false; return; }
    construirFormulario();
    $('quien').textContent = yo.nombre + ' (' + yo.rol + ')';
    $('barra').hidden = false; $('contenido').hidden = false;
    cargar();
  });
})();
</script>
</body>
</html>
